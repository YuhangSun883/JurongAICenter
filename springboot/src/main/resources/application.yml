# ============================================================
# JWT 配置(HS256,密钥至少 32 字节)
# 生产环境务必用环境变量覆盖:JWT_SECRET=xxx,别把密钥写进 yml 提交到 git
# ============================================================
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-32bytes-min}
  access-token-expiry: 2h
  refresh-token-expiry: 7d
  issuer: jurong-aicenter

spring:
  profiles:
    active: dev
  application:
    name: aicenter
  main:
    allow-circular-references: true   # V8 资产库：MediaService ↔ MediaLibraryService 循环依赖
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB       # 单文件最大（视频上传需要）
      max-request-size: 220MB    # 整个 multipart 请求最大
  mvc:
    throw-exception-if-no-handler-found: false

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jurong.aicenter.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ============================================================
# NewAPI 中转站配置（视频生成 / 聊天统一走这里 :3000）
# ============================================================
newapi:
  base-url: ${NEWAPI_BASE_URL:http://localhost:3000}
  token: ${NEWAPI_TOKEN:}

# ============================================================
# 独立后台首个管理员初始化
# 只写 console_admins 表，不会修改前台 users 用户密码。
# 线上第一次启动前设置 CONSOLE_ADMIN_EMAIL / CONSOLE_ADMIN_PASSWORD 即可。
# ============================================================
console:
  bootstrap:
    email: ${CONSOLE_ADMIN_EMAIL:}
    password: ${CONSOLE_ADMIN_PASSWORD:}
    display-name: ${CONSOLE_ADMIN_DISPLAY_NAME:超级管理员}

# ============================================================
# aicoming-video-proxy 配置（素材库 CRUD 走这里 :8080）
# 文档 §3 明说：素材上传不走 new-api（:3000 会 404），必须直连 proxy
# 默认指向雨云 192.140.163.161:8080，部署时通过环境变量覆盖
# ============================================================
aicoming:
  proxy:
    base-url: ${AICOMING_PROXY_BASE_URL:http://192.140.163.161:8080}
    token: ${AICOMING_PROXY_TOKEN:${NEWAPI_TOKEN:}}   # 默认复用 newapi token

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.jurong.aicenter: INFO
    com.baomidou.mybatisplus: WARN

# ============================================================
# LLM 配置（画布文本润色 / Agent 对话共用）
# ============================================================
llm:
  model: claude-sonnet-4-6  # 多模态模型（NewAPI 实际可用），支持图片理解
  max-tokens: 2048
  # 2026-08-14 新增:Agent 对话滑动窗口,只把最近 N 条原文喂给 LLM,
  #   超过这个数的早期内容直接丢掉(方案 A,先跑起来)。
  #   后续可平滑升级到方案 B(摘要压缩),不动前端。
  agent-context-window: 20
  system-prompt: |
    你是 Jurong AI 助手。用户可能上传图片给你。

    **任务**：
    1. 识别用户意图,决定是否需要跳转生成模块
    2. 如果要跳转 → 只输出一行简短引导语(不超过 20 字) + tool_call JSON,**不要分析图片内容、不要描述细节**
    3. 如果不需要跳转 → 直接回答问题即可

    **生成跳转规则**(满足时输出 tool_call JSON):
    - 用户动词包含"生成/做/画/创建/转换/变成/转成/换成/加上/做个"
    - 描述了具体目标(如"红色背景""卡通风格""短视频")
    - 上传图片 + 想生成 → 用图片作素材

    **不要跳转的情况**:
    - "分析/描述/这是什么/看看/帮我看下/是什么东西" → 只回答,不跳转

    **工具调用格式**(仅在需要跳转时输出,JSON 放在回复末尾):
    {"tool_call": {"action": "<action_name>", "prompt": "<用户意图>", "reason": "<简短解释>"}}

    **支持的 action**:
    - jump-to-image: 文生图(没有参考图)
    - jump-to-image-edit: 图生图(有参考图,要编辑/转换/风格化)
    - jump-to-video: 文生视频
    - jump-to-image-to-video: 图生视频
    - jump-to-product-image: 生成电商套图(用户说"电商套图/商品图/主图/详情图/上架图"等,针对图片)
    - jump-to-watermark-remover: 视频水印擦除(用户说"去水印/擦掉水印/清除水印"等,且是对视频操作)
    - jump-to-subtitle-remover: 视频字幕擦除(用户说"去字幕/擦掉字幕/清除字幕"等,针对视频)
    - jump-to-image-enhancer: 视频画质增强(用户说"视频变清晰/视频画质增强/超分/变高清/修复模糊"等,针对视频)

    **示例**:
    用户:"把这张图变成红色背景"
    → 回复:"好的。" + {"tool_call": {"action": "jump-to-image-edit", "prompt": "把背景换成红色", "reason": "图生图需求"}}

    用户:"帮我把这张商品图做一套电商主图"
    → 回复:"好的,跳转中。" + {"tool_call": {"action": "jump-to-product-image", "prompt": "做一套电商主图", "reason": "电商套图需求"}}

    用户:"这段视频有水印,去掉"
    → 回复:"好的。" + {"tool_call": {"action": "jump-to-watermark-remover", "prompt": "去掉视频上的水印", "reason": "视频水印擦除需求"}}

    用户:"把这个视频的字幕擦掉"
    → 回复:"好的。" + {"tool_call": {"action": "jump-to-subtitle-remover", "prompt": "擦掉视频里的字幕", "reason": "视频字幕擦除需求"}}

    用户:"这段视频太模糊了,能变清晰点吗"
    → 回复:"好的。" + {"tool_call": {"action": "jump-to-image-enhancer", "prompt": "把视频变清晰", "reason": "视频画质增强需求"}}

    用户:"这是什么花?"
    → 回复:"这是玫瑰花。"(不加 tool_call)

    普通问题直接回答,输出简洁,不要 markdown 格式,不要多余分析。
  image-poll-timeout-sec: 600    # ComfyUI text-to-image 超时（10 分钟）
  video-poll-timeout-sec: 1800   # NewAPI 视频生成超时（30 分钟）

# ============================================================
# Agent 上下文配置（滑动窗口,避免 LLM context 无限增长）
# DB 仍然全量存,前端 listMessages 也返回全量,只是喂给 LLM 时只取最近 N 条
# ============================================================
agent:
  context:
    # 喂给 LLM 的最近原文条数（不含 system prompt）
    max-raw-messages: 20

# 画布 workflow 模板位置（开发期用绝对路径指向项目根 workflows/目录）
canvas:
  workflows-dir: E:/8-10/JurongAICenter/workflows/
  # 画布节点的默认模型参数（最便宜档位，节省测试费用）
  defaults:
    image-model: gpt-image-2-1k
    image-size: 1024x1024    # ComfyUI 最小可用尺寸（512 不被节点接受）
    image-quality: low        # 最低质量（节省点数）
    video-model: doubao-seedance-2.0
    video-duration: 4         # 秒，最小
    video-resolution: 480P     # 最小分辨率
    video-enable-prompt-optimize: true
